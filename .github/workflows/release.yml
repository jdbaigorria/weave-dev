name: Release

# Distribution is via GitHub: users install the release wheels of both repos with
#   uv add "weave @ https://github.com/jdbaigorria/weave-dev/releases/download/vX.Y.Z/weave-X.Y.Z-py3-none-any.whl" \
#          "loom-declarative @ https://github.com/jdbaigorria/loom-dev/releases/download/vY.Z.W/loom_declarative-Y.Z.W-py3-none-any.whl"
# (or the git+https tags). Weave declares loom by version, so the consumer always
# names a loom source.
# This workflow builds the artifacts, smoke-tests the wheel, and attaches them to
# a GitHub Release. It does NOT publish to PyPI — re-add a publish step (and the
# id-token permission) if a PyPI name is registered later.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: weave-dev

      - uses: actions/checkout@v4
        with:
          repository: jdbaigorria/loom-dev
          path: loom-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check tag matches package version
        # The wheel filename and metadata come from pyproject, not from the tag.
        working-directory: weave-dev
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          [ "$v" = "${GITHUB_REF_NAME#v}" ] || { echo "::error::pyproject has version $v, tag is $GITHUB_REF_NAME"; exit 1; }

      - name: Build package
        working-directory: weave-dev
        run: uv build

      - name: Smoke-test the wheel
        # Refuses to release a wheel that can't even be imported. The wheel declares
        # loom by version only, so the ../loom-dev checkout supplies it (as in CI).
        working-directory: weave-dev
        run: |
          uv venv /tmp/weave-smoke
          uv pip install --python /tmp/weave-smoke/bin/python \
            "$(echo dist/*.whl)[fastapi,aws]" \
            "loom-declarative @ ../loom-dev"
          /tmp/weave-smoke/bin/python -c "import weave" \
            || { echo "::error::release wheel is broken: 'import weave' failed"; exit 1; }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Not dist/*: uv writes a dist/.gitignore, which GitHub would attach as default.gitignore.
          files: |
            weave-dev/dist/*.whl
            weave-dev/dist/*.tar.gz
