name: Release

# Distribution is via GitHub: users install with
#   uv add "weave @ git+https://github.com/jdbaigorria/weave-dev@vX.Y.Z" \
#          "loom-declarative @ git+https://github.com/jdbaigorria/loom-dev@vY.Z.W"
#   pip install "weave @ git+https://github.com/jdbaigorria/weave-dev@vX.Y.Z" \
#               "loom-declarative @ git+https://github.com/jdbaigorria/loom-dev@vY.Z.W"
# This workflow builds the artifacts, smoke-tests the wheel, and attaches them to
# a GitHub Release. It does NOT publish to PyPI — re-add a publish step (and the
# id-token permission) if a PyPI name is registered later.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: weave-dev

      - uses: actions/checkout@v4
        with:
          repository: jdbaigorria/loom-dev
          path: loom-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build package
        working-directory: weave-dev
        run: uv build

      - name: Smoke-test the wheel
        # Refuses to release a wheel that can't even be imported.
        working-directory: weave-dev
        run: |
          uv venv /tmp/weave-smoke
          uv pip install --python /tmp/weave-smoke/bin/python \
            "$(echo dist/*.whl)[fastapi,aws]" \
            "loom-declarative @ ../loom-dev"
          /tmp/weave-smoke/bin/python -c "import weave" \
            || { echo "::error::release wheel is broken: 'import weave' failed"; exit 1; }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: weave-dev/dist/*
